[project]
name = "ai-safeguard-mcp-gateway"
version = "0.2.0"
description = "Audited FastMCP gateway for Cloudflare Workers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp==1.12.4",
    "pydantic==2.10.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1,<3.0",
    "pytest>=8.4.1,<9.0",
    "ruff>=0.12.5,<1.0",
    "workers-py>=1.7.2,<2.0",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
